[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdsvault"
version = "0.1.0"
description = "Offline, hardware-rooted, privacy-preserving Aadhaar face verification for PDS ration shops"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pdsvault = "pdssec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
