# Render blueprint: single-service SkyGuard AI (FastAPI serves API + WS + UI).
# In Render Dashboard: New > Blueprint > connect repo > select this file.
services:
  - type: web
    name: skyguard-ai
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements-deploy.txt
      npm --prefix frontend install
      npm --prefix frontend run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
    healthCheckPath: /health
