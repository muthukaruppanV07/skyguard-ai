name: missinglink-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: missinglink-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missinglink}
      POSTGRES_USER: ${POSTGRES_USER:-missinglink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgis-init.sh:/docker-entrypoint-initdb.d/10-postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missinglink}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - missinglink-net

  redis:
    image: redis:7-alpine
    container_name: missinglink-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - missinglink-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: missinglink-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - backend-storage:/app/storage
    networks:
      - missinglink-net

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
    container_name: missinglink-ai
    env_file:
      - .env
    environment:
      AI_PORT: 8000
      AI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-missinglink}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-missinglink}
      AI_API_KEY: ${AI_SERVICE_API_KEY:-change-me-ai-gateway-key}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - missinglink-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
    container_name: missinglink-frontend
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - missinglink-net

volumes:
  pgdata:
  backend-storage:

networks:
  missinglink-net:
    driver: bridge
