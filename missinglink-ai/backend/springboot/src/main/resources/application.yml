server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: missinglink-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/missinglink}
    username: ${SPRING_DATASOURCE_USERNAME:missinglink}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-strong-password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

missinglink:
  jwt:
    secret: ${JWT_SECRET:change-me-64-characters-minimum-random-hex-string-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
    access-token-ttl-ms: ${JWT_ACCESS_TOKEN_TTL_MS:900000}
    refresh-token-ttl-ms: ${JWT_REFRESH_TOKEN_TTL_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  ai:
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    api-key: ${AI_SERVICE_API_KEY:change-me-ai-gateway-key}
    fallback-allowed: ${AI_FALLBACK_ALLOWED:true}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    root: ${STORAGE_ROOT:./storage}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    signed-url-expire-minutes: ${PUBLIC_CASE_URL_EXPIRE_MINUTES:15}
  crypto:
    encryption-key: ${ENCRYPTION_KEY:}
  email:
    provider: ${EMAIL_PROVIDER:console}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:no-reply@missinglink.local}
  notifications:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:60}
    login-per-minute: 5
    sighting-per-minute: 10
  data:
    retention-days: ${DATA_RETENTION_DAYS:365}
  mfa:
    required: ${MFA_REQUIRED:false}
  matching:
    weights:
      face: 0.35
      clothing: 0.15
      accessory: 0.05
      body: 0.05
      image: 0.10
      location: 0.15
      time: 0.10
      text: 0.05
    geo-radius-km: 25.0
    time-decay-hours: 24.0
    min-overall-score: 0.55

logging:
  level:
    com.missinglink: INFO
